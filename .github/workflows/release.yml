name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Keep in sync with the go directive in go.mod
        go-version: '1.26'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: implementations/typescript/package-lock.json

    - name: Run tests
      run: make test

    - name: Run TypeScript tests
      run: make test-typescript
    
    - name: Run linter
      uses: golangci/golangci-lint-action@v6
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      with:
        version: v1.64.8
        install-mode: goinstall
    
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
