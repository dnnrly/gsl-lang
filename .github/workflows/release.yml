name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version to publish (defaults to the tag, or package.json if set on a branch)'
        required: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Keep in sync with the go directive in go.mod
        go-version: '1.26'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: implementations/typescript/package-lock.json

    - name: Run tests
      run: make test

    - name: Run TypeScript tests
      run: make test-typescript

    - name: Run acceptance tests
      run: make test-acceptance

    - name: Install plantuml
      run: sudo apt-get update && sudo apt-get install -y plantuml

    - name: Install mermaid-cli
      run: npm install -g @mermaid-js/mermaid-cli

    - name: Run integration tests
      run: make test-integration-strict

    - name: Run linter
      uses: golangci/golangci-lint-action@v6
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      with:
        version: v1.64.8
        install-mode: goinstall

  release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Keep in sync with the go directive in go.mod
        go-version: '1.26'

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: implementations/typescript

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'
        cache: npm
        cache-dependency-path: implementations/typescript/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Determine version
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
        elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        fi

    - name: Stamp package versions
      run: node scripts/set-version.mjs

    - name: Build
      run: npm run build

    - name: Publish packages
      run: |
        for pkg in core gql; do
          name="@gsl-lang/$pkg"
          ver=$(node -p "require('./packages/$pkg/package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "$name@$ver is already on npm — skipping"
            continue
          fi
          tag_args=()
          if [[ "$ver" == *-* ]]; then
            tag_args=(--tag next)
          fi
          npm publish -w "packages/$pkg" "${tag_args[@]}"
        done
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISHING_KEY }}
