name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/typescript

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'
        cache: npm
        cache-dependency-path: implementations/typescript/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Set package version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$'; then
          echo "Tag v$VERSION is not a valid semver version" >&2
          exit 1
        fi
        export VERSION
        node -e '
          const fs = require("fs");
          for (const pkg of ["core", "gql"]) {
            const f = `packages/${pkg}/package.json`;
            const j = JSON.parse(fs.readFileSync(f, "utf8"));
            j.version = process.env.VERSION;
            if (j.dependencies && j.dependencies["@gsl-lang/core"]) {
              j.dependencies["@gsl-lang/core"] = "^" + process.env.VERSION;
            }
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
          }
        '

    - name: Build
      run: npm run build

    - name: Publish packages
      run: |
        for pkg in core gql; do
          name="@gsl-lang/$pkg"
          ver=$(node -p "require('./packages/$pkg/package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "$name@$ver is already on npm — skipping"
          else
            npm publish -w "packages/$pkg"
          fi
        done
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISHING_KEY }}
