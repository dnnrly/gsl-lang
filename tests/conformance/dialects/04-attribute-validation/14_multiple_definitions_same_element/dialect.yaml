id: multiple-definitions
version: '1'
nodes:
  rules:
  - name: ServiceName
    match: kind == "service"
    attributes:
      type: object
      required:
      - name
      properties:
        name:
          type: string
  - name: ServiceReplicas
    match: kind == "service"
    attributes:
      type: object
      required:
      - replicas
      properties:
        replicas:
          type: integer
