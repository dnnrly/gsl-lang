# Reference dialect: conventions for describing software architecture in GSL.
# See spec/dialects/DIALECTS_SPEC.md (worked example, section 13).

id: software-architecture
version: 0.4.0-draft
title: Software Architecture
description: |
  Conventions for describing software architecture: independently
  identifiable services, the directed dependencies between them, and
  orthogonal classifications.
guidance: |
  Represent independently identifiable software services as nodes. Use
  directed edges for runtime dependencies and sets for orthogonal
  classifications. Attribute schemas validate the projected JSON
  representation of each element's attributes, not the GSL source syntax.

nodes:
  rules:
    - name: Service
      description: |
        An independently identifiable software service.
      guidance: |
        Use a service node for a separately identifiable runtime or
        deployable component. Set `owner` to a node reference.
      match: 'kind == "service"'
      attributes:
        type: object
        required:
          - kind
          - name
          - owner
          - replicas
        properties:
          kind:
            const: service
          name:
            type: string
            minLength: 1
            maxLength: 120
          owner:
            type: object
            properties:
              "$gslRef":
                type: string
            required:
              - "$gslRef"
            additionalProperties: false
          replicas:
            type: integer
            minimum: 1
            maximum: 1000
          description:
            type: string
        additionalProperties: true

edges:
  rules:
    - name: Dependency
      description: |
        A directed runtime dependency between two services.
      guidance: |
        Use an edge for a dependency that has its own attributes, such as the
        protocol used. Choose the protocol from the controlled vocabulary.
      match: 'protocol exists'
      attributes:
        type: object
        required:
          - protocol
        properties:
          protocol:
            enum:
              - http
              - grpc
              - tcp
        additionalProperties: true

sets:
  policy:
    allow_undefined: false
    require_all: true
    allow_empty: false
  definitions:
    critical:
      description: |
        Elements whose failure has immediate user or business impact.
      guidance: |
        Apply `@critical` to services and sets that must be operated with the
        highest priority.
    deprecated:
      description: |
        Elements that remain in service but should not gain new dependants.
      guidance: |
        Apply `@deprecated` to services scheduled for replacement.
